name: One-shot Fast Redeploy Polish

on:
  push:
    branches:
      - perf/streamline-redeploy-reconcile
    paths:
      - .github/workflows/one-shot-fast-redeploy-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/streamline-redeploy-reconcile
          fetch-depth: 0

      - name: Polish fast-path diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/lxc-manager.sh",
              '''if [[ "${FAST_REDEPLOY:-false}" != "true" ]] && ! command -v omp >/dev/null 2>&1; then
              curl -fsSL https://omp.sh/install | sh
          fi
          export PATH="/root/.local/bin:/usr/local/bin:$PATH"
          omp --version
          ''',
              '''if ! command -v omp >/dev/null 2>&1; then
              if [[ "${FAST_REDEPLOY:-false}" == "true" ]]; then
                  echo "Missing required Dev command during Fast Redeploy: omp" >&2
                  exit 1
              fi
              curl -fsSL https://omp.sh/install | sh
          fi
          export PATH="/root/.local/bin:/usr/local/bin:$PATH"
          omp --version
          ''',
          )
          replace_once(
              "scripts/lxc-manager.sh",
              '''fi
          fi
          systemctl enable code-server@root
          systemctl restart code-server@root
          ''',
              '''fi
          fi
          if [[ "${FAST_REDEPLOY:-false}" == "true" ]] && ! command -v code-server >/dev/null 2>&1; then
              echo "Missing required Dev command during Fast Redeploy: code-server" >&2
              exit 1
          fi
          systemctl enable code-server@root
          systemctl restart code-server@root
          ''',
          )

          replace_once(
              "scripts/modules/dev-terminal.sh",
              '''    for required_file in         /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh         /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh; do
                  [[ -f "$required_file" ]] || {
                      echo "Missing required Dev terminal file during Fast Redeploy: $required_file" >&2
                      exit 1
                  }
              done
          fi
          ''',
              '''    required_files=(
                  /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
                  /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
              )
              for required_file in "${required_files[@]}"; do
                  [[ -f "$required_file" ]] || {
                      echo "Missing required Dev terminal file during Fast Redeploy: $required_file" >&2
                      exit 1
                  }
              done
          fi
          ''',
          )
          replace_once(
              "scripts/modules/dev-terminal.sh",
              '''else
              [[ -f "$workbench_dir/JetBrainsMonoNerdFontMono-Regular.ttf" ]] || {
                  echo "Missing Dev terminal Nerd Font during Fast Redeploy" >&2
                  exit 1
              }
          fi
          ''',
              '''else
              [[ -f "$workbench_dir/workbench.html" ]] || {
                  echo "Missing code-server workbench during Fast Redeploy" >&2
                  exit 1
              }
              [[ -f "$workbench_dir/JetBrainsMonoNerdFontMono-Regular.ttf" ]] || {
                  echo "Missing Dev terminal Nerd Font during Fast Redeploy" >&2
                  exit 1
              }
          fi
          ''',
          )
          replace_once(
              "scripts/modules/dev-terminal.sh",
              '''# Reconcile Oh My Zsh without its interactive installer so both fresh deploys
          # and fast redeploys follow the same idempotent path.
          ''',
              '''# Refresh Oh My Zsh during full deploys. Fast Redeploy deliberately avoids
          # network access and only validates that the existing checkout is usable.
          ''',
          )
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -d '' shell_files < <(git ls-files -z '*.sh')
          bash -n "${shell_files[@]}"
          shellcheck -x -S warning "${shell_files[@]}"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fast-redeploy-polish.yml
          git add scripts/lxc-manager.sh scripts/modules/dev-terminal.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(redeploy): clarify fast-path prerequisites"
          git push origin HEAD:perf/streamline-redeploy-reconcile
