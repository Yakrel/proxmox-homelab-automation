name: Validate Repository

on:
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - "**/*.md"
      - installer.sh
      - stacks.yaml
      - "docker/**"
      - "config/**"
      - "docs/**"
      - .github/workflows/validate.yml
  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.md"
      - installer.sh
      - stacks.yaml
      - "docker/**"
      - "config/**"
      - "docs/**"
      - .github/workflows/validate.yml
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare lightweight validators
        run: |
          shellcheck --version
          python3 -m pip install --quiet PyYAML==6.0.2

      - name: Validate shell
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(git ls-files -z '*.sh')
          bash -n "${shell_files[@]}"
          sh -n config/pi/pi-memory
          shellcheck -x -S warning "${shell_files[@]}" config/pi/pi-memory

      - name: Validate YAML, JSON, and XML
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          import yaml

          for pattern in ('*.yml', '*.yaml'):
              for path in pathlib.Path('.').glob(f'**/{pattern}'):
                  if '.git' not in path.parts:
                      yaml.safe_load(path.read_text(encoding='utf-8'))
                      print(f'YAML OK: {path}')

          for path in pathlib.Path('.').glob('**/*.json*'):
              if '.git' not in path.parts and path.suffix in {'.json', '.template'}:
                  json.loads(path.read_text(encoding='utf-8'))
                  print(f'JSON OK: {path}')

          for path in pathlib.Path('.').glob('**/*.xml.template'):
              ET.parse(path)
              print(f'XML OK: {path}')
          PY

      - name: Validate topology, environment schemas, and deployment invariants
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import yaml

          root = pathlib.Path('.')

          allowed_markdown = {
              pathlib.Path('README.md'),
              pathlib.Path('AGENTS.md'),
              pathlib.Path('CLAUDE.md'),
          }
          markdown_files = {
              path for path in root.glob('**/*.md') if '.git' not in path.parts
          }
          unexpected_markdown = sorted(markdown_files - allowed_markdown)
          if unexpected_markdown:
              raise SystemExit(
                  'Documentation must stay in the root README.md; unexpected Markdown: '
                  + ', '.join(map(str, unexpected_markdown))
              )

          topology = yaml.safe_load(pathlib.Path('stacks.yaml').read_text(encoding='utf-8'))
          stacks = topology['stacks']
          required_fields = {'ct_id', 'hostname', 'cpu_cores', 'memory_mb', 'disk_gb'}
          seen_ids = set()
          seen_hostnames = set()
          for name, config in stacks.items():
              missing = sorted(required_fields - config.keys())
              if missing:
                  raise SystemExit(f'{name} is missing stack fields: {missing}')
              ct_id = config['ct_id']
              hostname = config['hostname']
              if ct_id in seen_ids:
                  raise SystemExit(f'Duplicate LXC ID: {ct_id}')
              if hostname in seen_hostnames:
                  raise SystemExit(f'Duplicate LXC hostname: {hostname}')
              if not 2 <= ct_id <= 254:
                  raise SystemExit(f'LXC ID cannot form a valid static IP: {ct_id}')
              if any(config[field] <= 0 for field in ('cpu_cores', 'memory_mb', 'disk_gb')):
                  raise SystemExit(f'Invalid resources for stack: {name}')
              seen_ids.add(ct_id)
              seen_hostnames.add(hostname)

          driver_sha256 = topology.get('nvidia', {}).get('driver_sha256', '')
          if not re.fullmatch(r'[a-f0-9]{64}', driver_sha256):
              raise SystemExit('nvidia.driver_sha256 must be a lowercase SHA-256 value')

          env_key_pattern = re.compile(r'^[A-Za-z_][A-Za-z0-9_]*$')
          compose_var_pattern = re.compile(r'\$\{([A-Za-z_][A-Za-z0-9_]*)')

          def example_keys(path):
              keys = []
              for line_number, raw_line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  line = raw_line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if '=' not in line:
                      raise SystemExit(f'Invalid env example line: {path}:{line_number}')
                  key = line.split('=', 1)[0].strip()
                  if not env_key_pattern.fullmatch(key):
                      raise SystemExit(f'Invalid env key: {path}:{line_number}: {key}')
                  if key in keys:
                      raise SystemExit(f'Duplicate env key in {path}: {key}')
                  keys.append(key)
              return set(keys)

          def service_environment(service, stack_name, service_name):
              environment = service.get('environment') or []
              result = {}
              if isinstance(environment, dict):
                  result = dict(environment)
              else:
                  for item in environment:
                      if not isinstance(item, str) or '=' not in item:
                          continue
                      key, value = item.split('=', 1)
                      if key in result:
                          raise SystemExit(
                              f'Duplicate Compose environment key: {stack_name}/{service_name}/{key}'
                          )
                      result[key] = value
              return result

          schedules = {}
          compose_documents = {}
          docker_stacks = set(stacks) - {'dev'}
          for stack_name in sorted(docker_stacks):
              stack_dir = pathlib.Path('docker') / stack_name
              compose_path = stack_dir / 'docker-compose.yml'
              example_path = stack_dir / '.env.example'
              encrypted_path = stack_dir / '.env.enc'
              for required_path in (compose_path, example_path, encrypted_path):
                  if not required_path.is_file():
                      raise SystemExit(f'Missing stack file: {required_path}')
              if not encrypted_path.read_bytes().startswith(b'Salted__'):
                  raise SystemExit(f'Invalid OpenSSL ciphertext header: {encrypted_path}')

              keys = example_keys(example_path)
              compose_text = compose_path.read_text(encoding='utf-8')
              referenced = set(compose_var_pattern.findall(compose_text))
              unknown = sorted(referenced - keys - {'TZ'})
              if unknown:
                  raise SystemExit(
                      f'{compose_path} references variables absent from .env.example: {unknown}'
                  )

              document = yaml.safe_load(compose_text)
              compose_documents[stack_name] = document
              for service_name, service in document.get('services', {}).items():
                  environment = service_environment(service, stack_name, service_name)
                  schedule = environment.get('WATCHTOWER_SCHEDULE')
                  if schedule:
                      if schedule in schedules:
                          raise SystemExit(
                              f'Duplicate Watchtower schedule for {stack_name} and {schedules[schedule]}: {schedule}'
                          )
                      schedules[schedule] = stack_name

          for encrypted_path in pathlib.Path('docker').glob('**/*.enc'):
              if not encrypted_path.read_bytes().startswith(b'Salted__'):
                  raise SystemExit(f'Invalid OpenSSL ciphertext header: {encrypted_path}')

          forbidden_environment = {
              ('ai', 'hermes'): {'HERMES_DASHBOARD_TUI'},
              ('desktop', 'vaultwarden'): {'WEBSOCKET_ENABLED'},
              ('media', 'jellyseerr'): {'PUID', 'PGID', 'UMASK'},
              ('media', 'recyclarr'): {'PUID', 'PGID', 'UMASK'},
              ('media', 'flaresolverr'): {'PROXY', 'CAPTCHA_SOLVER', 'PUID', 'PGID', 'UMASK'},
          }
          for (stack_name, service_name), forbidden in forbidden_environment.items():
              service = compose_documents[stack_name]['services'][service_name]
              configured = set(service_environment(service, stack_name, service_name))
              present = sorted(configured & forbidden)
              if present:
                  raise SystemExit(
                      f'Unsupported environment variables in {stack_name}/{service_name}: {present}'
                  )

          flare_ports = compose_documents['media']['services']['flaresolverr'].get('ports') or []
          if any('8191' in str(port) for port in flare_ports):
              raise SystemExit('FlareSolverr must remain internal to the media Docker network')
          jd_ports = compose_documents['utility']['services']['jdownloader2'].get('ports') or []
          if any('3129' in str(port) for port in jd_ports):
              raise SystemExit('JDownloader Direct Connection port must not be published')

          backrest = json.loads(
              pathlib.Path('config/backrest/config.json.template').read_text(encoding='utf-8')
          )
          hook_commands = {
              hook.get('actionCommand', {}).get('command')
              for repo in backrest['repos']
              for hook in repo.get('hooks', [])
          }
          if '/config/sync-offsite-mirrors.sh' not in hook_commands:
              raise SystemExit('Backrest offsite mirror hook path is inconsistent')
          config_plan = next(plan for plan in backrest['plans'] if plan['id'] == 'config-backup')
          stale_excludes = {
              '/backup-sources/config/*/Backups',
              '/backup-sources/config/*/backups',
              '/backup-sources/config/tailscale',
              '/backup-sources/config/backrest/config/sync-to-gdrive.sh',
          }
          present = sorted(set(config_plan['excludes']) & stale_excludes)
          if present:
              raise SystemExit(f'Stale Backrest exclusions: {present}')

          print('Repository topology and deployment invariants OK')
          PY

      - name: Validate Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          for stack in ai desktop gateway media utility; do
              cp "docker/$stack/.env.example" "docker/$stack/.env"
              (cd "docker/$stack" && docker compose config --quiet)
              rm -f "docker/$stack/.env"
          done

      - name: Validate Agentmemory TypeScript bundle
        shell: bash
        run: |
          set -euo pipefail
          contract_dir=$(mktemp -d /tmp/agentmemory-contract.XXXXXX)
          test ! -e node_modules
          trap 'unlink node_modules 2>/dev/null || true; rm -rf "$contract_dir"' EXIT
          npm install \
            --prefix "$contract_dir" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --no-save \
            --package-lock=false \
            @earendil-works/pi-coding-agent@latest \
            @types/node@24 \
            esbuild@0.25.8 \
            typebox@latest \
            typescript@5.9.3
          ln -s "$contract_dir/node_modules" node_modules

          "$contract_dir/node_modules/.bin/tsc" \
            --noEmit \
            --strict \
            --skipLibCheck \
            --module NodeNext \
            --moduleResolution NodeNext \
            --target ES2024 \
            --lib ES2024,DOM \
            --types node \
            config/pi/agentmemory/client.ts \
            config/pi/agentmemory/index.ts \
            config/pi/agentmemory/security.ts

          "$contract_dir/node_modules/.bin/esbuild" config/pi/agentmemory/index.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --external:@earendil-works/pi-coding-agent \
            --outfile=/tmp/agentmemory-extension.mjs
          node --check /tmp/agentmemory-extension.mjs
          "$contract_dir/node_modules/.bin/esbuild" config/pi/agentmemory/client.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=/tmp/agentmemory-client.mjs
          AGENTMEMORY_CLIENT_BUNDLE=/tmp/agentmemory-client.mjs \
            node --test config/pi/agentmemory/client.test.mjs
          AGENTMEMORY_EXTENSION_BUNDLE=/tmp/agentmemory-extension.mjs \
            node --test config/pi/agentmemory/extension.test.mjs

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/architecture-data.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.current = []
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.in_script = True
                      self.external = 'src' in dict(attrs)
                      self.current = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      content = ''.join(self.current)
                      if not self.external and content.strip():
                          self.parts.append(content)
                      self.in_script = False

          for html in Path('docs').glob('*.html'):
              parser = Scripts()
              parser.feed(html.read_text(encoding='utf-8'))
              Path(f'/tmp/{html.name}.js').write_text(
                  '\n;\n'.join(parser.parts), encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/topology.html.js
