name: ai

networks:
  ai-net:
    driver: bridge

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    ports:
      # Hermes requires its own authentication for non-loopback dashboard binds,
      # including access through the SNO-protected Nginx Proxy Manager host.
      - "192.168.1.104:9119:9119"
    volumes:
      - /fastpool/config/hermes:/opt/data
      # Intentional trusted-agent access: Hermes manages homelab application
      # configuration and data through its authenticated web dashboard.
      - /fastpool/config:/fastpool/config
      - /datapool:/datapool
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
    command: ["gateway", "run"]
    networks:
      - ai-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
        labels: "com.docker.compose.service,com.docker.compose.project"

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 48 0 * * *
      - WATCHTOWER_NOTIFICATION_URL=telegram://${WATCHTOWER_TELEGRAM_TOKEN:-}@telegram?chats=${WATCHTOWER_TELEGRAM_CHAT_IDS:-}
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - 'WATCHTOWER_NOTIFICATION_TEMPLATE={{- if .Report -}}{{- with .Report -}}{{- if .Updated -}}{{len .Updated}} container updated:{{range .Updated}}{{"\n"}}- {{.Name}} ({{.ImageName}}): {{.CurrentImageID.ShortID}} -> {{.LatestImageID.ShortID}}{{end}}{{- end -}}{{- end -}}{{- end -}}'
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
      - WATCHTOWER_NOTIFICATION_TITLE_TAG=lxc-ai
    networks:
      - ai-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
        labels: "com.docker.compose.service,com.docker.compose.project"

  omniroute:
    image: diegosouzapw/omniroute:next
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "20128:20128"
    volumes:
      - /fastpool/config/omniroute:/app/data
    environment:
      - NODE_ENV=production
      - PORT=20128
      - DATA_DIR=/app/data
      - REQUIRE_API_KEY=true
      - JWT_SECRET=${OMNI_JWT_SECRET}
      - API_KEY_SECRET=${OMNI_API_KEY_SECRET}
      - INITIAL_PASSWORD=${OMNI_INITIAL_PASSWORD}
    networks:
      - ai-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
        labels: "com.docker.compose.service,com.docker.compose.project"

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "8888:8888"
      - "9999:9999"
    volumes:
      - /fastpool/config/hindsight:/home/hindsight/.pg0
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=openai
      - HINDSIGHT_API_LLM_BASE_URL=http://omniroute:20128/v1
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_API_LLM_API_KEY}
      - HINDSIGHT_API_LLM_MODEL=shared/resilient-multimodal
      - HINDSIGHT_API_LLM_OUTPUT_LANGUAGE=Turkish
      - HINDSIGHT_API_LLM_MAX_CONCURRENT=2
      - HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT=1
      - HINDSIGHT_API_REFLECT_LLM_MAX_CONCURRENT=1
      - HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT=1
      - HINDSIGHT_API_LLM_MAX_RETRIES=0
      - HINDSIGHT_API_CONSOLIDATION_MAX_ATTEMPTS=2
      - HINDSIGHT_API_WORKER_ID=hindsight-prod
      - HINDSIGHT_API_WORKER_MAX_SLOTS=3
      - HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS=0
      - HINDSIGHT_API_WORKER_MAX_RETRIES=3
      - HINDSIGHT_API_WORKER_TASK_RETRY_BACKOFF_SECONDS=60
      - HINDSIGHT_API_CONSOLIDATION_LLM_PARALLELISM=1
      - HINDSIGHT_API_MENTAL_MODEL_MIN_REFRESH_INTERVAL_SECONDS=21600
      - HINDSIGHT_API_EMBEDDINGS_PROVIDER=google
      - HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY=${HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY}
      - HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL=gemini-embedding-001
      - HINDSIGHT_API_EMBEDDINGS_GEMINI_OUTPUT_DIMENSIONALITY=768
      - HINDSIGHT_API_RERANKER_PROVIDER=rrf
      - HINDSIGHT_API_ENABLE_RERANKING=false
      - HINDSIGHT_API_TEXT_SEARCH_EXTENSION_NATIVE_LANGUAGE=turkish
      - HINDSIGHT_API_LLM_TRACE_ENABLED=false
      - HINDSIGHT_API_OPERATION_RETENTION_DAYS=7
      - HINDSIGHT_API_OPERATION_CLEANUP_INTERVAL_SECONDS=3600
      - HINDSIGHT_API_TENANT_EXTENSION=hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      - HINDSIGHT_API_TENANT_API_KEY=${HINDSIGHT_API_KEY}
      - HINDSIGHT_CP_DATAPLANE_API_KEY=${HINDSIGHT_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - ai-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
        labels: "com.docker.compose.service,com.docker.compose.project"
