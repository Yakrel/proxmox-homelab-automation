---
# settings.yaml
# https://gethomepage.dev/latest/configs/settings

title: Proxmox Homelab
favicon: https://www.proxmox.com/favicon.ico

# Theme & Appearance - Minimalist
theme: dark
color: zinc
headerStyle: clean

# Project-local background avoids an external image dependency.
background:
  image: /images/homepage-background.png
  saturate: 60
  brightness: 35
  opacity: 30

# Quick Launch
quicklaunch:
  searchDescriptions: true
  provider: google

# Layout Configuration
layout:
  Infrastructure:
    style: row
    columns: 4
    icon: proxmox.png
  Platforms:
    style: row
    columns: 5
    icon: mdi-server-network
  Media:
    style: row
    columns: 4
    icon: jellyfin.png
  Operations:
    style: row
    columns: 4
    icon: mdi-chart-box
  Network:
    style: row
    columns: 4
    icon: mdi-lan
  Applications:
    style: row
    columns: 6
    icon: mdi-apps

# Display Options - Minimalist
fullWidth: true
useEqualHeights: true
disableCollapse: true
